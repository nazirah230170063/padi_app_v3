<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="Segoe UI,Arial,sans-serif"><rect width="760" height="200" rx="14" fill="#f3f8ef"/>
<text x="380" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#245a33">Fase pertumbuhan padi dan tingkat kerugian bila diserang tikus</text>
<g font-size="12.5" font-weight="700" text-anchor="middle">
<rect x="20" y="44" width="100" height="58" fill="#cfe6c3"/><text x="70" y="70" fill="#1f5c33">Persemaian</text><text x="70" y="88" font-size="11" font-weight="400" fill="#1f5c33">0-21 hari</text>
<rect x="120" y="44" width="180" height="58" fill="#9fd18b"/><text x="210" y="70" fill="#1f5c33">Vegetatif</text><text x="210" y="88" font-size="11" font-weight="400" fill="#1f5c33">sampai +/- 45 HST</text>
<rect x="300" y="44" width="120" height="58" fill="#5fa84a"/><text x="360" y="70" fill="#fff">Bunting</text><text x="360" y="88" font-size="11" font-weight="400" fill="#fff">+/- 45-65 HST</text>
<rect x="420" y="44" width="100" height="58" fill="#e6cf5a"/><text x="470" y="70" fill="#4a3d00">Berbunga</text><text x="470" y="88" font-size="11" font-weight="400" fill="#4a3d00">+/- 65-80 HST</text>
<rect x="520" y="44" width="140" height="58" fill="#d9a62e"/><text x="590" y="70" fill="#fff">Pemasakan</text><text x="590" y="88" font-size="11" font-weight="400" fill="#fff">+/- 80-105 HST</text>
<rect x="660" y="44" width="80" height="58" fill="#b07a2a"/><text x="700" y="70" fill="#fff">Panen</text><text x="700" y="88" font-size="11" font-weight="400" fill="#fff">+/- 105-120</text>
<rect x="20" y="116" width="100" height="14" fill="#f2c14e"/><text x="70" y="146" fill="#555" font-weight="400">Sedang</text>
<rect x="120" y="116" width="180" height="14" fill="#f2c14e"/><text x="210" y="146" fill="#555" font-weight="400">Sedang (anakan bisa pulih)</text>
<rect x="300" y="116" width="120" height="14" fill="#d9534f"/><text x="360" y="146" fill="#555" font-weight="400">Tinggi</text>
<rect x="420" y="116" width="100" height="14" fill="#d9534f"/><text x="470" y="146" fill="#555" font-weight="400">Tinggi</text>
<rect x="520" y="116" width="140" height="14" fill="#d9534f"/><text x="590" y="146" fill="#555" font-weight="400">Tinggi (hasil hilang)</text>
<rect x="660" y="116" width="80" height="14" fill="#f2c14e"/><text x="700" y="146" fill="#555" font-weight="400">Sedang</text></g>
<text x="20" y="180" font-size="12" fill="#5c6b61">HST = hari setelah tanam. Umur tiap fase hanya perkiraan dan berbeda menurut varietas.</text></svg>
