{% extends "base.html" %}{% block c %}
<div class="row g-4"><div class="col-lg-7"><form method="post" enctype="multipart/form-data" class="card card-body w-100" onsubmit="b.disabled=true;b.textContent='Memprediksi...'"><input type="hidden" name="t" value="{{ token() }}">
<label class="fw-bold mb-2">Pilih foto tanaman padi</label>
<input type="file" name="foto" accept="image/*" class="form-control mb-3" required onchange="pv.src=URL.createObjectURL(this.files[0]);pv.classList.remove('d-none')">
<img id="pv" class="img-fluid rounded mb-3 d-none" alt="preview"><button id="b" name="b" class="btn btn-success btn-lg">Prediksi</button></form></div>
<div class="col-lg-5"><div class="sec"><h3>Tips memotret</h3><ul class="mb-0"><li>Ambil dari jarak dekat, rumpun padi terlihat jelas.</li><li>Cahaya cukup dan tidak buram.</li><li>Fokus pada batang dan malai.</li><li>Satu foto untuk satu area yang diperiksa.</li></ul></div></div></div>{% endblock %}
